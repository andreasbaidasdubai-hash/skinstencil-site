<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{metaTitle}}</title>
<meta name="description" content="{{metaDesc}}">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta property="og:title" content="{{metaTitle}}">
<meta property="og:description" content="{{metaDesc}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:site_name" content="Skinstencil">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317161C'/%3E%3Cpath d='M16 5 L21 18 L16 22 L11 18 Z M14 23 H18 V28 H14 Z' fill='none' stroke='%23A99BFF' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Guide pages share the landing page tokens so light and dark match. Logical properties keep right-to-left languages correct. */
:root{
  --paper:#F1F2EF; --card:#FAFAF8; --ink:#17161C; --muted:#5E5C68; --line:#D6D5DD;
  --stencil:#4F35C8; --stencil-soft:#E6E2F8;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;margin:0}
html[lang="ar"] body{font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:800;font-stretch:84%;font-size:22px;letter-spacing:-.01em;text-decoration:none;color:inherit;direction:ltr}
.mark span{color:var(--stencil)}
.topnav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topnav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.topnav a:hover,.topnav a[aria-current]{color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langsel{font:500 13px var(--body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.themebtn{font:500 15px var(--body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;line-height:1.2}
.themebtn:focus-visible,.btn:focus-visible,.langsel:focus-visible,a:focus-visible{outline:2px solid var(--stencil);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-stretch:84%;letter-spacing:-.012em;line-height:1.15;margin:0;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;font-stretch:100%;letter-spacing:0;line-height:1.35}
h1{font-size:clamp(30px,5.4vw,50px);font-weight:800}
h2{font-size:clamp(23px,3.4vw,31px);font-weight:700;margin-top:44px}
h3{font-size:19px;font-weight:700;margin-top:24px}
main .wrap{max-width:760px;padding-block:8px 56px}
.crumbs{font-size:13px;color:var(--muted);margin:18px 0 22px}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 8px}
.crumbs li+li::before{content:"/";margin-inline-end:8px;color:var(--line)}
.crumbs a{color:var(--muted)}
.meta{font:400 12px var(--mono);color:var(--muted);margin:14px 0 0}
.answer{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--stencil);border-radius:10px;padding:16px 18px;margin:24px 0 0}
.answer b{display:block;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stencil);margin-bottom:6px}
.answer p{margin:0}
p,ul,ol{margin:14px 0 0}
ul,ol{padding-inline-start:22px}
li{margin-top:6px}
a{color:var(--stencil)}
.tbl{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:start}
th{background:var(--card);font-weight:600}
td{font-family:var(--mono);font-size:14px}
ol.how{list-style:none;padding:0;counter-reset:s}
ol.how li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 14px;margin-top:10px}
ol.how li::before{content:counter(s);display:inline-block;font:600 13px var(--mono);color:var(--stencil);margin-inline-end:10px}
ol.how b{font-weight:600}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:600;cursor:pointer}
details p{color:var(--muted);margin:8px 0 0}
.btn{display:inline-block;text-align:center;text-decoration:none;font:600 15px var(--body);border-radius:10px;padding:13px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
.cta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:44px}
.cta p{margin:0 0 14px}
.cta .fine{font:400 12px var(--mono);color:var(--muted);margin:14px 0 0}
.cards{display:grid;gap:14px;margin-top:22px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card:hover{border-color:var(--stencil)}
.card h2,.card h3{font-size:19px;margin:0;font-weight:700}
.card p{margin:6px 0 0;color:var(--muted);font-size:15px}
.related{margin-top:44px}
.related h2{margin-top:0;font-size:22px}
.lead{color:var(--muted);font-size:18px;margin-top:12px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer a{color:inherit}
footer .wrap{padding-block:28px}
@media (max-width:560px){body{font-size:16px}.topnav{gap:10px}.langsel{max-width:110px}header .wrap{padding-block:12px}}
</style>
{{ldjson}}
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
{{siteHead}}
<main><div class="wrap">
{{body}}
</div></main>
{{siteFoot}}
<script>window.I18N={{i18n_json}};</script>
<script src="/js/config.js"></script>
<script src="/js/analytics.js"></script>
<script>var s=document.getElementById('langSel');if(s)s.addEventListener('change',function(){location.href=s.value;});</script>
</body>
</html>
